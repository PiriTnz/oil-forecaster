apiVersion: v1
kind: Namespace
metadata:
  name: oil-forecaster
  labels:
    name: oil-forecaster
    monitoring: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oil-forecaster-config
  namespace: oil-forecaster
data:
  ARTIFACTS_DIR: "/app/artifacts"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  LLM_MODEL: "claude-sonnet-4-5"
  HORIZON_DAYS: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: oil-forecaster-secrets
  namespace: oil-forecaster
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_BEFORE_DEPLOY"
  EIA_API_KEY: "REPLACE_BEFORE_DEPLOY"
  FRED_API_KEY: "REPLACE_BEFORE_DEPLOY"
