apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oil-forecaster-ingress
  namespace: oil-forecaster
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - oil-forecaster.example.com
        - mlflow.oil-forecaster.example.com
      secretName: oil-forecaster-tls
  rules:
    - host: oil-forecaster.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oil-forecaster-api
                port:
                  number: 80
    - host: mlflow.oil-forecaster.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  number: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
  namespace: oil-forecaster
spec:
  podSelector:
    matchLabels:
      app: oil-forecaster-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - {}  # outbound for API calls (Yahoo, Anthropic, EIA, FRED)
