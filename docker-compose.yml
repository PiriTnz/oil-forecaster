version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil-forecaster-api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EIA_API_KEY=${EIA_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      - mlflow
    networks: [app-net]
    restart: unless-stopped

  training:
    build:
      context: .
      dockerfile: Dockerfile.training
    container_name: oil-forecaster-trainer
    profiles: ["training"]  # docker compose --profile training up
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EIA_API_KEY=${EIA_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      - mlflow
    networks: [app-net]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: oil-forecaster-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
    volumes:
      - mlflow-data:/mlflow
    networks: [app-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: oil-forecaster-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [app-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: oil-forecaster-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on: [prometheus]
    networks: [app-net]
    restart: unless-stopped

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:

networks:
  app-net:
    driver: bridge
